apiVersion: v1
kind: Pod
metadata:
  name: bad
spec:
  securityContext:
    runAsNonRoot: true
  volumes:
    - name: node-root
      hostPath:
        path: /
  containers:
    - name: app
      image: nginxinc/nginx-unprivileged:1.27-alpine
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
