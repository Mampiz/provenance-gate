apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-host-path
spec:
  steps:
    - name: a compliant pod is admitted
      try:
        - apply:
            file: good.yaml
    - name: a pod mounting a hostPath volume is rejected by this policy
      try:
        - apply:
            file: bad.yaml
            expect:
              # Asserting the policy NAME, not just that something failed. Six
              # policies are active, and a bad case that trips a different one
              # would otherwise pass this test for the wrong reason.
              - check:
                  ($error != null): true
                  (contains($error, 'disallow-host-path')): true
