apiVersion: v1
kind: Pod
metadata:
  name: bad
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      # No tag and no digest. This resolves to :latest without ever saying so,
      # which is why disallow-latest-tag alone is not enough.
      image: nginxinc/nginx-unprivileged
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
