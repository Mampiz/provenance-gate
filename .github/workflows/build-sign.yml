# The trusted builder.
#
# This is a reusable workflow, and that is the whole point rather than a
# convenience. When a caller invokes it, the OIDC token GitHub issues to the job
# carries job_workflow_ref pointing at THIS file, not at the caller. The caller
# cannot change what happens in here without changing this repository, so the
# build steps are outside the control of the repository being built. That
# separation between the thing being built and the thing doing the building is
# what SLSA calls Build L3, and it is the reason none of this lives inline in a
# caller workflow.
#
# What a consumer ends up able to check, all of it from the registry:
#
#   * the Fulcio certificate's SAN is this workflow's ref, so the artifact was
#     built HERE and not by a workflow somebody wrote in their own repository
#   * the provenance predicate's externalParameters.workflow names the calling
#     repository, workflow path and ref, so the artifact is tied to ONE source
#   * the SBOM attestation is signed by the same identity
#
# Every action is pinned by commit SHA. A tag is a mutable pointer, and a
# supply-chain project that trusts mutable pointers in its own supply chain is
# not making an argument, it is making a claim.

name: build-sign

on:
  workflow_call:
    inputs:
      image:
        description: >-
          Image reference without a tag, lowercase, for example
          ghcr.io/mampiz/provenance-gate.
        required: true
        type: string
      context:
        description: Docker build context.
        required: false
        default: .
        type: string
      dockerfile:
        description: Path to the Dockerfile, relative to the context.
        required: false
        default: Dockerfile
        type: string
      extra-tag:
        description: >-
          An additional tag to publish alongside the immutable short-SHA tag.
          Never "latest": the operator's admission webhook rejects it.
        required: false
        default: ""
        type: string
    outputs:
      image:
        description: The image reference that was pushed, without a tag.
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: The digest of the pushed image. This is the only reference that means anything.
        value: ${{ jobs.build.outputs.digest }}
      tag:
        description: The immutable short-SHA tag that was published.
        value: ${{ jobs.build.outputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Push the image and, with push-to-registry, the attestations next to it.
      packages: write
      # Request the OIDC token that keyless signing and provenance are built on.
      id-token: write
      # Record the attestations against the repository as well as the registry.
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.ref.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the image reference
        id: ref
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # Container registries reject uppercase in a repository name and
          # github.repository preserves the owner's casing, so lowercase it here
          # rather than discovering it in a push error.
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          tag="sha-${GITHUB_SHA::12}"
          {
            echo "image=${image}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble the tag list
        id: tags
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          TAG: ${{ steps.ref.outputs.tag }}
          EXTRA: ${{ inputs.extra-tag }}
        run: |
          set -euo pipefail
          if [ "${EXTRA}" = "latest" ]; then
            echo "::error::extra-tag cannot be 'latest': a mutable tag defeats the point of signing a digest" >&2
            exit 1
          fi
          tags="${IMAGE}:${TAG}"
          if [ -n "${EXTRA}" ]; then
            tags="${tags}"$'\n'"${IMAGE}:${EXTRA}"
          fi
          {
            echo "list<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            VERSION=${{ steps.ref.outputs.tag }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # BuildKit can attach its own provenance and SBOM attestations. Both
          # are turned off deliberately. With them on, the pushed artifact is an
          # OCI image index with an extra unknown/unknown manifest, the digest
          # that comes back is the index digest rather than the image manifest
          # digest, and a consumer resolving a tag to a digest and asking for
          # its referrers gets a different answer than the one attested here.
          # One provenance format, produced by one tool, is the point.
          provenance: false
          sbom: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          # Without this the attestation lives only in the GitHub API, and the
          # admission webhook in F3 would have to call GitHub on the admission
          # path. Pushed to the registry it is an OCI referrer of the image, so
          # verification needs nothing but the registry the image came from.
          push-to-registry: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest with cosign, keyless
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # The digest, never a tag. Signing a tag signs a pointer that anyone
          # with push access can move afterwards.
          #
          # This is deliberately redundant with the provenance attestation
          # above: the two carry the same OIDC identity, but the ecosystem is
          # split. Kyverno and the Sigstore Policy Controller consume a cosign
          # signature, GitHub's own tooling consumes the attestation bundle.
          # Publishing both means a consumer is not forced to pick our side.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate an SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.ref.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # The SBOM is an attestation, not a release asset. Uploading it as a
          # loose artifact would produce an unsigned copy that looks equally
          # official and is attached to nothing.
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Summarise what was published
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          {
            echo "### Published"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Image | \`${IMAGE}:${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Builder | \`${GITHUB_WORKFLOW_REF}\` |"
            echo "| Source | \`${GITHUB_REPOSITORY}\` at \`${GITHUB_REF}\` |"
            echo
            echo '```bash'
            echo "gh attestation verify oci://${IMAGE}@${DIGEST} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
