# The verifiers, in a cluster built from nothing.
#
# The point of running these in CI is that a phase cannot quietly stop working.
# Every verifier here is the same script run locally, with no CI-only relaxation:
# if it passes here it passes on a laptop, and if it fails here the phase is not
# done.
#
# F1 and F3 are deliberately absent. Both check images published to ghcr.io for
# the current commit, which the release workflow produces in parallel with this
# one, so running them here would be a race. They live in e2e-provenance.yml,
# which runs after release has finished.

name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/kind-cluster

      - name: F0
        run: make verify-f0

      - name: F2
        run: make verify-f2

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context=kind-provenance-local get pods -A || true
          kubectl --context=kind-provenance-local get validatingpolicy -o wide || true
          kubectl --context=kind-provenance-local -n kyverno logs -l app.kubernetes.io/component=admission-controller --tail=100 || true
