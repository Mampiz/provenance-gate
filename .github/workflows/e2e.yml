# The verifiers, in a cluster built from nothing.
#
# The point of running these in CI is that a phase cannot quietly stop working.
# Every verifier here is the same script run locally, with no CI-only relaxation:
# if it passes here it passes on a laptop, and if it fails here the phase is not
# done.
#
# verify-f1 is deliberately absent. It checks the image published to ghcr.io for
# the current commit, which the release workflow produces in parallel with this
# one, so running it here would be a race. It belongs to the release path.

name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifiers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Raise the inotify limits kind needs
        # The runner ships with fs.inotify.max_user_instances at 128, below
        # kind's documented minimum. make preflight refuses to create a cluster
        # under it, which is the same thing it does on a laptop.
        run: |
          echo 'fs.inotify.max_user_instances=8192' | sudo tee /etc/sysctl.d/99-kind.conf
          echo 'fs.inotify.max_user_watches=524288' | sudo tee -a /etc/sysctl.d/99-kind.conf
          sudo sysctl --system >/dev/null

      - name: Install kind
        env:
          KIND_VERSION: v0.32.0
          KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/kind \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /usr/local/bin/kind" | sha256sum -c -
          sudo chmod +x /usr/local/bin/kind

      - name: Bring up the cluster
        run: make bootstrap

      - name: F0
        run: make verify-f0

      - name: F2
        run: make verify-f2

      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl --context=kind-provenance-local get pods -A || true
          kubectl --context=kind-provenance-local get validatingpolicy -o wide || true
          kubectl --context=kind-provenance-local -n kyverno logs -l app.kubernetes.io/component=admission-controller --tail=100 || true
