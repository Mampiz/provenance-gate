name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: The generated CRD and deepcopy code are current
        # controller-gen output is committed, so a change to api/ that was not
        # regenerated would ship a CRD that does not match the Go types. The
        # symptom is a field silently missing from the schema.
        run: |
          make manifests
          git diff --exit-code -- api config/crd \
            || { echo "::error::run 'make manifests' and commit the result"; exit 1; }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Through make, so CI uses the pinned shellcheck rather than whatever
      # version the runner image happens to ship. A linter that differs between
      # a laptop and CI is a linter that fails only in CI.
      - name: shellcheck
        run: make lint-shell
