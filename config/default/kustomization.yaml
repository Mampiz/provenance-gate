# The full deployment: CRD, RBAC, the manager and the webhook configuration.
#
# This is what an install applies. The image it carries is pinned to a release
# tag, never :latest, because this project's own Kyverno corpus refuses mutable
# tags and there is no reason for its own manifests to be an exception.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../crd
  - ../rbac
  - ../manager
  - ../webhook
