apiVersion: apps/v1
kind: Deployment
metadata:
  name: provenance-gate
  namespace: provenance-gate-system
  labels:
    app.kubernetes.io/name: provenance-gate
spec:
  # Two replicas because an admission webhook is on the critical path of every
  # matching request. A single replica means every rolling update, node drain or
  # eviction is a window with no webhook, which with failurePolicy Fail is a
  # window where nothing can be deployed.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: provenance-gate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provenance-gate
    spec:
      serviceAccountName: provenance-gate
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: ghcr.io/mampiz/provenance-gate:latest
          args:
            - --admission-timeout=4s
            - --cache-ttl=10m
            - --cache-failure-ttl=30s
          env:
            # go-containerregistry's default keychain reads a docker config from
            # here. Mounting one is how a private registry works; the secret is
            # optional, so a cluster pulling only public images needs nothing.
            - name: DOCKER_CONFIG
              value: /etc/registry
          ports:
            - name: webhook
              containerPort: 9443
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: serving-cert
              mountPath: /tmp/k8s-webhook-server/serving-certs
              readOnly: true
            - name: sigstore-cache
              mountPath: /tmp/sigstore
            - name: registry-credentials
              mountPath: /etc/registry
              readOnly: true
      volumes:
        - name: serving-cert
          secret:
            secretName: provenance-gate-webhook-cert
        # The root filesystem is read-only, and the Sigstore TUF client needs
        # somewhere to keep its metadata.
        - name: sigstore-cache
          emptyDir: {}
        - name: registry-credentials
          secret:
            secretName: provenance-gate-registry
            optional: true
      # Spread the replicas so a single node going away does not take the
      # webhook with it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: provenance-gate
