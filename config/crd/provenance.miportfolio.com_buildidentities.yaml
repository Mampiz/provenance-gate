---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: buildidentities.provenance.miportfolio.com
spec:
  group: provenance.miportfolio.com
  names:
    kind: BuildIdentity
    listKind: BuildIdentityList
    plural: buildidentities
    shortNames:
    - bid
    singular: buildidentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject.kind
      name: Subject
      type: string
    - jsonPath: .spec.provenance.sourceRepository
      name: Source
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BuildIdentity is the trust root for the images of one workload.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the trust root
            properties:
              imageRepositories:
                description: |-
                  ImageRepositories restricts which image repositories this trust root
                  covers, as references without a tag, for example ghcr.io/mampiz/my-service.
                  An image outside the list is refused rather than ignored: a workload that
                  could pull an unrelated image alongside its own would defeat the check.
                items:
                  type: string
                minItems: 1
                type: array
              provenance:
                description: Provenance is what those workloads' images must prove.
                properties:
                  builder:
                    description: |-
                      Builder is the signing identity that must appear in the certificate, which
                      for GitHub Actions is the reusable workflow that performed the build:

                        https://github.com/OWNER/REPO/.github/workflows/build-sign.yml@refs/heads/main

                      This is the trusted builder. It is not the repository being built, and
                      confusing the two is how "signed by somebody at GitHub" gets mistaken for
                      a supply-chain control.
                    pattern: ^https://
                    type: string
                  issuer:
                    description: |-
                      Issuer is the OIDC issuer that signed the build's identity, for example
                      https://token.actions.githubusercontent.com. A signature from any other
                      issuer is refused even if it is otherwise valid.
                    pattern: ^https://
                    type: string
                  sourceRepository:
                    description: |-
                      SourceRepository is the repository the provenance must name as the source
                      of the build, for example https://github.com/Mampiz/my-service. This is the
                      field that ties an image to one service and refuses an image built by a
                      different, entirely legitimate workflow.
                    pattern: ^https://
                    type: string
                  workflowPath:
                    description: |-
                      WorkflowPath is the path of the calling workflow within SourceRepository,
                      for example .github/workflows/release.yml. Optional: when empty, any
                      workflow in the source repository is accepted.
                    type: string
                  workflowRef:
                    description: |-
                      WorkflowRef is the git ref the build ran from, for example
                      refs/heads/main. Optional: when empty, any ref of the source repository is
                      accepted. Leaving it empty means a build from any branch is trusted, which
                      is rarely what anybody wants.
                    type: string
                required:
                - builder
                - issuer
                - sourceRepository
                type: object
              subjects:
                description: |-
                  Subjects selects the workloads this trust root governs. A workload is
                  governed when it matches any one of them.

                  A list rather than a single subject because one service takes more than
                  one shape in the cluster. A WebApp is admitted, and then the operator
                  creates a Deployment whose pods are admitted separately. Both are the same
                  service and both must prove the same build identity, and splitting that
                  across two BuildIdentity resources would be two places to keep in step.
                items:
                  description: |-
                    SubjectReference selects the workloads a BuildIdentity governs, within its own
                    namespace.

                    Exactly one of Name or Selector is set. Name is the right answer for a custom
                    resource a person applies and names; Selector is the only workable answer for
                    Pods, whose names are generated by the ReplicaSet that owns them.
                  properties:
                    apiVersion:
                      description: |-
                        APIVersion of the governed resource, for example "platform.miportfolio.com/v1"
                        or "v1" for a Pod.
                      minLength: 1
                      type: string
                    kind:
                      description: Kind of the governed resource, for example "WebApp"
                        or "Pod".
                      minLength: 1
                      type: string
                    name:
                      description: Name of a single governed resource.
                      minLength: 1
                      type: string
                    selector:
                      description: Selector matches governed resources by label.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - apiVersion
                  - kind
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of name or selector must be set
                    rule: has(self.name) != has(self.selector)
                minItems: 1
                type: array
            required:
            - imageRepositories
            - provenance
            - subjects
            type: object
          status:
            description: status defines the observed state
            properties:
              conditions:
                description: conditions represent the current state of the trust root.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the metadata.generation this status
                  was computed from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
