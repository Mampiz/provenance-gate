# The full deployment: CRD, RBAC, the manager, and the webhook configuration.
#
# The image is patched at install time by the Makefile, so the manifest in git
# never carries a tag that pretends to be current.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - crd/provenance.miportfolio.com_buildidentities.yaml
  - rbac/rbac.yaml
  - manager/manager.yaml
  - webhook/webhook.yaml
